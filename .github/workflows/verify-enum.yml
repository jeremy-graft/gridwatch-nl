name: verify-enum (temporary)

# TEMPORARY, DELETE AFTER USE. Proves the monthly area-list refresh works from a GitHub runner
# (app config + one MapTiler tile, Referer-locked key) before the cron relies on it.
# --dry-run: fetches and validates, writes nothing, commits nothing.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-enum.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Dry-run refresh and assert it followed the live config
        run: |
          python tools/enumerate_area_ids.py --dry-run | tee out.txt
          grep -q "live app config" out.txt || { echo "::error::did not read the live tileset config"; exit 1; }
          grep -Eq "^(2[0-9]{2}|3[0-9]{2}) areas from tileset" out.txt || { echo "::error::unexpected area count"; exit 1; }
