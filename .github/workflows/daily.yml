name: daily snapshot

# ~06:00 Europe/Amsterdam (05:00 UTC winter / 04:00 UTC summer — cron is UTC-only, so this
# fires 06:00 CET / 07:00 CEST; close enough, the source updates at most daily).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full per-area sweep regardless of manifest change"
        type: boolean
        default: false
      refresh_areas:
        description: "Refresh the area list from the map first, then sweep it (normally automatic on the 1st)"
        type: boolean
        default: false

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Monthly area-list refresh: on the 1st (or on demand), BEFORE the snapshot, so the monthly
      # backstop sweep in fetch.py covers the fresh list in the same run. Needed because the API
      # keeps answering for ids the map dropped and never lists new ones (44 areas went
      # unarchived for weeks before this existed). One MapTiler tile request a month.
      # A failed refresh never blocks the snapshot: the old list is kept, and the daily monitor
      # pushes a reminder once the list is more than 35 days old.
      - name: Refresh area list (monthly)
        id: areas
        if: ${{ github.event_name == 'schedule' || inputs.refresh_areas }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" = "01" ]; then
            if python tools/enumerate_area_ids.py; then
              echo "refreshed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Area-list refresh failed; kept the existing list. The snapshot still runs."
            fi
          else
            echo "Not the 1st of the month; no area-list refresh today."
          fi

      - name: Fetch snapshot
        env:
          GRIDWATCH_CONTACT: ${{ secrets.GRIDWATCH_CONTACT }}
        run: |
          python fetch.py ${{ ((github.event_name == 'workflow_dispatch' && inputs.full) || steps.areas.outputs.refreshed == 'true') && '--full' || '' }}

      - name: Commit changes
        run: |
          git config user.name  "gridwatch-nl bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      # No external alerting service. fetch.py exits non-zero on any hard failure (403/HTML
      # block, too many area errors, API down), which fails this job — and GitHub emails you
      # for failed runs on your own repos (Settings → Notifications → Actions). The weekly
      # external self-check is the backstop for the one case this can't cover: a scheduled run
      # that never fires at all.
      - name: Flag failure in the run log
        if: failure()
        run: echo "::error::gridwatch-nl daily snapshot failed — see the steps above."
