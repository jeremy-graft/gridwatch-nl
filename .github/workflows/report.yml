name: weekly report

# Regenerates REPORT.md (the Netcongestie Monitor) + parse/report_data.json from the archive's
# git history. Reads data/ only — never the network. Weekly: the source publishes irregularly
# (4 days to 4 weeks apart), and a monthly run left the public report up to a month stale.
# The report is stamped with the data date, so a week without a publication commits nothing.
on:
  schedule:
    - cron: "0 8 * * 1"   # weekly (Mon); the report only changes when a new publication landed
  workflow_dispatch:

# Same group as the daily snapshot so the two never race on a push.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the report is computed FROM git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate report
        run: python parse/report.py

      - name: Commit report
        run: |
          git config user.name  "gridwatch-nl bot"
          git config user.email "actions@github.com"
          git add REPORT.md SAMENVATTING.md parse/report_data.json
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Flag failure in the run log
        if: failure()
        run: echo "::error::gridwatch-nl monthly report failed — see the steps above."
